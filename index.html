<!doctype html>
<html lang="en" data-theme="meadow">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1df" />
  <meta name="description" content="Stevies World: my recipes, workouts and notes, ready on my phone." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Stevies World" />
  <title>Stevies World</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    // Apply the saved theme before first paint so there's no flash.
    try {
      var t = localStorage.getItem('sw.theme') || 'meadow';
      if (t === 'meadow' && localStorage.getItem('sw.autoNight') !== '0' && matchMedia('(prefers-color-scheme: dark)').matches) t = 'night';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Stevies World home"><img src="/assets/icon.svg" width="30" height="30" alt="" /><span>stevies world</span></a>
    <nav class="desk-nav" aria-label="Sections">
      <a href="#/" data-tab="home">Home</a>
      <a href="#/recipes" data-tab="recipes">Recipes</a>
      <a href="#/workouts" data-tab="workouts">Workouts</a>
      <a href="#/notes" data-tab="notes">Notes</a>
      <a class="desk-add" href="#/add" data-tab="add">Add</a>
    </nav>
    <a class="round-btn settings-btn" href="#/settings" data-tab="settings" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></a>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Sections">
    <a href="#/" data-tab="home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg><span>Home</span></a>
    <a href="#/recipes" data-tab="recipes"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg><span>Recipes</span></a>
    <a href="#/add" data-tab="add" class="tab-add" aria-label="Add"><span class="add-disc"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#/workouts" data-tab="workouts"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Workouts</span></a>
    <a href="#/notes" data-tab="notes"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19 13 11"/></svg><span>Notes</span></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="empty-line">Stevies World needs JavaScript turned on.</p></noscript>
</body>
</html>
